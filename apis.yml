aid: toornament
name: Toornament
description: >-
  Toornament is an esports tournament management platform providing a comprehensive API for creating, managing, and
  viewing tournaments across 100+ esports disciplines. The API supports full tournament lifecycle management including
  participant registration, bracket generation, match reporting, and real-time standings. Used by game publishers,
  esports organizers, broadcasters, and gaming communities worldwide.
